name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one validation run per branch at a time. A new push cancels
# any in-flight run for the same ref so we don't waste CI minutes on
# obsolete commits.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
