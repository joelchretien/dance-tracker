function recomputeAwards(){
  ABLOCKS=[];DAWARDS={};
  for(var a=0;a<AWARDS.length;a++){
    var blockStart=(a===0)?0:AWARDS[a-1]+1;
    var blockEnd=AWARDS[a];
    var has=false;
    for(var j=blockStart;j<blockEnd;j++){if(isD(S[j])){has=true;break;}}

}

  var els=document.querySelectorAll('[id^="e"]');
  for(var i=0;i<els.length;i++){
    var t=els[i].getBoundingClientRect().top;
    if(t>-50){anchor=els[i];anchorY=t;break;}
  }
  document.querySelectorAll(".dt").forEach(function(d){d.style.display=sd?"block":"none";});
  var db=document.getElementById("detailsBtn");
  db.className=sd?"tbtn on":"tbtn";
  // JS fallback scroll correction (supplements CSS overflow-anchor)
  if(anchor){
    requestAnimationFrame(function(){
      var newY=anchor.getBoundingClientRect().top;
      if(Math.abs(newY-anchorY)>2)window.scrollBy(0,newY-anchorY);
    });
  }
  showToast(sd?"\u24D8 Details shown":"\u24D8 Details hidden");
}

var curObs=null;
function updateSnapArrow(){
  var snap=document.getElementById("snapback");
  if(snap.style.display==="none")return;
  var cel=document.getElementById("e"+ci);
  if(!cel)return;
  var r=cel.getBoundingClientRect();
  var arrow=r.top<0?"\u2191 ":"\u2193 ";
  var e=S[ci];
  snap.textContent=arrow+(e.title||"Current")+(e.time?" \u00b7 "+e.time:"");
  var botH=document.getElementById("bot").offsetHeight;
  snap.style.bottom=(botH+12)+"px";
}
window.addEventListener("scroll",updateSnapArrow,{passive:true});
function watchCurrent(){
  if(curObs)curObs.disconnect();
  var cel=document.getElementById("e"+ci);
  if(!cel)return;
  curObs=new IntersectionObserver(function(entries){
    var snap=document.getElementById("snapback");
    if(entries[0].isIntersecting){
      snap.style.display="none";
    }else{
      snap.style.display="block";
      updateSnapArrow();
    }
  },{threshold:0.1});
  curObs.observe(cel);
}

function snapToCurrent(){
  var cel=document.getElementById("e"+ci);
  if(cel)cel.scrollIntoView({behavior:"smooth",block:"center"});
}

function updSched(){
  var el=document.getElementById("sched");
  var e=S[ci];
  var t=pT(e.time);
  if(t===null){el.textContent="";return;}
  var now=new Date();
  var nowMin=now.getHours()*60+now.getMinutes();
  var diff=nowMin-t;
  if(Math.abs(diff)<=2){
    el.style.color="#4ade80";
    el.textContent="\u2713 On schedule";
  }else if(diff>0){
    el.style.color="#fb923c";
    el.textContent="~"+diff+" min behind schedule";
  }else{
    el.style.color="#38bdf8";
    el.textContent="~"+Math.abs(diff)+" min ahead of schedule";
  }
}
setInterval(updSched,30000);

function upd(doScroll){
  if(doScroll===undefined)doScroll=true;
  var e=S[ci],hl=isD(e);
  document.querySelectorAll(".en.cur,.bk.cur").forEach(function(el){el.classList.remove("cur");});
  var cel=document.getElementById("e"+ci);
  if(cel){
    cel.classList.add("cur");
    if(doScroll)cel.scrollIntoView({behavior:"smooth",block:"center"});
  }
  watchCurrent();

  var di=DI.indexOf(ci);
  document.getElementById("progFill").style.width=((di>=0?di+1:1)/TOT*100)+"%";
  var db=document.getElementById("detailsBtn");
  db.className=sd?"tbtn on":"tbtn";
  document.querySelectorAll(".dt").forEach(function(d){d.style.display=sd?"block":"none";});
  var ban=document.getElementById("ban");
  var bbtn=document.getElementById("bbtn");
  var isAwd=isDaughterAwards(ci);
  if(hl){
    ban.style.display="block";
    ban.style.background="linear-gradient(135deg,#fbbf24,#f59e0b)";
    ban.style.textAlign="center";
    var onCat=fST(e.category);
    ban.innerHTML='<div style="font-size:15px;font-weight:800;color:#1a1a2e">ON NOW \u2014 '+esc(wD(e).join(" & "))+'</div><div style="font-size:13px;font-weight:600;color:rgba(0,0,0,0.45);margin-top:2px">'+esc(e.title)+(onCat?' \u00b7 '+onCat:'')+'</div>';
    bbtn.style.display="none";
  }else if(isAwd){
    ban.style.display="block";
    ban.style.background="linear-gradient(135deg,#fbbf24,#f59e0b)";
    ban.style.textAlign="center";
    ban.innerHTML='<div style="font-size:15px;font-weight:800;color:#1a1a2e">'+esc(e.title)+'</div><div style="font-size:13px;font-weight:600;color:rgba(0,0,0,0.45);margin-top:2px">Your girls are in this block</div>';
    bbtn.style.display="none";
  }else if(nxt!==null){
    ban.style.display="none";
    bbtn.style.display="block";
    var cnt=cU(nxt),ne=S[nxt];
    var td=tD(pT(e.time),pT(ne.time));
    var isNxtAwd=isDaughterAwards(nxt);
    var line1='<div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap"><span style="font-size:22px;font-weight:800;color:#fbbf24;line-height:1">'+cnt+'</span><span style="font-size:14px;color:#fbbf24;font-weight:600">'+(cnt===1?"dance":"dances")+' until</span><span style="font-size:14px;color:#fbbf24;font-weight:800">'+esc(ne.title)+'</span></div>';
    var line2,line3;
    if(isNxtAwd){
      line2='<div style="font-size:12px;color:rgba(251,191,36,0.5);margin-top:3px">Your dancers are in this block'+(ne.time?' \u00b7 '+ne.time:'')+(td?' \u00b7 '+td:'')+'</div>';
      line3='<div style="font-size:11px;color:rgba(251,191,36,0.35);margin-top:2px">tap to jump</div>';
    }else{
      var catInfo=fST(ne.category);
      line2='<div style="font-size:12px;color:rgba(251,191,36,0.6);margin-top:3px">'+(catInfo?catInfo+' \u00b7 ':'')+ne.time+(td?' \u00b7 '+td:'')+'</div>';
      line3='<div style="font-size:11px;color:rgba(251,191,36,0.35);margin-top:2px">'+esc(wD(ne).join(" & "))+' \u00b7 tap to jump</div>';
    }
    bbtn.innerHTML=line1+line2+line3;
  }else{
    ban.style.display="none";
    bbtn.style.display="none";
  }
  var pb=document.getElementById("pb"),nb=document.getElementById("nb");
  pb.className=ci<=1?"bx":"bo";pb.disabled=ci<=1;
  nb.className=ci>=S.length-1?"bx":"bo";nb.disabled=ci>=S.length-1;
  updSched();
}

// Watch panel
var wpFilter="";
function showWatch(){document.getElementById("wp").className="open";renderWP();document.getElementById("wpSearch").value="";wpFilter="";}
function hideWatch(){document.getElementById("wp").className="";onWatchChange();}
function filterWP(){wpFilter=document.getElementById("wpSearch").value.toLowerCase();renderWP();}
var toastTimer=null;
function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;
  t.className="show";
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.className="";},1800);
}
function toggleW(name){
  var idx=DN.indexOf(name);
  if(idx>=0){DN.splice(idx,1);showToast("\u2606 Removed "+name);}
  else{DN.push(name);showToast("\u2605 Watching "+name);}
  saveWatched();
  renderWP();
}
function renderWP(){
  var el=document.getElementById("wpList");
  var h="";
  // Build filtered list, watched first
  var watched=[],unwatched=[];
  for(var i=0;i<ALL_DANCERS.length;i++){
    var n=ALL_DANCERS[i];
    if(wpFilter&&n.toLowerCase().indexOf(wpFilter)<0)continue;
    if(DN.indexOf(n)>=0)watched.push(n);
    else unwatched.push(n);
  }
  var all=watched.concat(unwatched);
  if(watched.length>0&&unwatched.length>0&&!wpFilter){
    // Show a subtle separator after watched dancers
    for(var i=0;i<watched.length;i++){
      h+='<div class="wpItem watched" data-name="'+esc(watched[i])+'">';
      h+='<span class="name">'+esc(watched[i])+'</span>';
      h+='<span class="check">\u2605</span></div>';
    }
    h+='<div class="wpSec">All Dancers</div>';
    for(var i=0;i<unwatched.length;i++){
      h+='<div class="wpItem" data-name="'+esc(unwatched[i])+'">';
      h+='<span class="name">'+esc(unwatched[i])+'</span>';
      h+='<span class="check">\u2606</span></div>';
    }
  }else{
    for(var i=0;i<all.length;i++){
      var n=all[i];
      var w=DN.indexOf(n)>=0;
      h+='<div class="wpItem'+(w?' watched':'')+'" data-name="'+esc(n)+'">';
      h+='<span class="name">'+esc(n)+'</span>';
      h+='<span class="check">'+(w?'\u2605':'\u2606')+'</span></div>';
    }
  }
  el.innerHTML=h;
}
document.getElementById("wpList").addEventListener("click",function(ev){
  var item=ev.target.closest(".wpItem");
  if(item&&item.dataset.name){toggleW(item.dataset.name);}
});
function onWatchChange(){
  recomputeAwards();
  bld();
  upd();
  updWatchBtn();
}
function updWatchBtn(){
  var wb=document.getElementById("watchBtn");
  var svg='<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  wb.innerHTML=svg;
  wb.className=DN.length>0?"tbtn active":"tbtn";
}

loadWatched();
recomputeAwards();
ld();
bld();
upd();
updWatchBtn();
}catch(ex){
  document.getElementById("err").style.display="block";
  document.getElementById("err").textContent="Error: "+ex.message+" | "+ex.stack;
}
</script>
